name: PyTest

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}${{ matrix.requirements != '' && ' (minimum)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        requirements: [""]
        include:
          - python-version: "3.10"
            requirements: ci/requirements/minimal_requirements.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/minimal_requirements.txt

      - name: Install pinned environment
        if: matrix.requirements != ''
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Install MRpro and test dependencies
        run: python -m pip install ".[tests]" pytest-github-actions-annotate-failures

      - name: Show resolved environment
        run: python -c "import platform, torch; print(platform.python_version()); print(torch.__version__)"

      - name: Run tests
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.python-version == '3.12' }}" = "true" ]; then
            python -m pytest -m "not cuda" --junitxml=pytest.xml \
              --cov-report=term-missing:skip-covered --cov=mrpro | tee pytest-coverage.txt
          else
            python -m pytest -m "not cuda"
          fi

      - name: Upload recommended PyTest coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-recommended
          path: |
            pytest-coverage.txt
            pytest.xml
          if-no-files-found: ignore
