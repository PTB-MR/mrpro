name: Clean docker

on:
  schedule:
    - cron: "0 3 * * 0"  # weekly, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  prune:
    name: Delete stale per-run images from GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: mrpro_runner
      KEEP: 10
    steps:
      - name: Delete old package versions (never the one tagged latest)
        run: |
          set -euo pipefail
          api="/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE}/versions"

          # --paginate emits one JSON array per page, so merge them with jq
          # before sorting and slicing.
          gh api --paginate "$api" \
            | jq -r --argjson keep "$KEEP" '
                add
                | map(select((.metadata.container.tags | index("latest")) | not))
                | sort_by(.created_at) | reverse
                | .[$keep:]
                | .[].id' \
            > to_delete.txt

          echo "Versions to delete: $(wc -l < to_delete.txt)"
          while read -r id; do
            echo "Deleting version $id"
            gh api -X DELETE "$api/$id"
          done < to_delete.txt
